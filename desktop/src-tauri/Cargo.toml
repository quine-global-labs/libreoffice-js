[package]
name = "libreoffice-js"
version = "0.1.0"
description = "LibreOffice JS — a Tauri + React office suite modelled on LibreOffice core"
authors = ["LibreOffice JS"]
edition = "2021"

[lib]
name = "libreoffice_js_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
percent-encoding = "2"

[features]
# This feature is used for production builds or when `devPath` points to the
# filesystem and the built-in dev server is disabled.
custom-protocol = ["tauri/custom-protocol"]
